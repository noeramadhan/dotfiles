theme = "base16_transparent"

[editor]
color-modes = true
scrolloff = 5
line-number = "relative"
mouse = true
true-color = true
end-of-line-diagnostics = "hint"
text-width = 100

[editor.soft-wrap]
enable = true
wrap-at-text-width = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["file-name", "file-modification-indicator"]
center = ["spinner", "spacer", "version-control"]
right = ["diagnostics", "workspace-diagnostics", "position"]
mode.normal = "N"
mode.insert = "I"
mode.select = "S"

[editor.whitespace.render]
space = "all"
tab = "all"
nbsp = "all"
nnbsp = "all"
newline = "none"

[editor.whitespace.characters]
space = " "
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
tabpad = " "

[editor.indent-guides]
render = true
character = ""
skip-levels = 1

[editor.lsp]
display-progress-messages = true
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.file-picker]
hidden = false
ignore = false

[keys.normal]
C-h = [":bp"]
C-l = [":bn"]
"space" = { "x" = ":buffer-close!", "s" = ":w", "q" = ":q!", "o"= "symbol_picker", "r"=":rla", "n"=":n", "p"=":sh echo '%{buffer_name}' | pbcopy" }
"A-down" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
"A-up" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
C-z = []
