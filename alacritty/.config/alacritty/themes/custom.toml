# Custom Modest — Alacritty Theme
# Derived from Zed "Custom Modest" dark theme

[colors.primary]
background = '#030303'
foreground = '#abb2bf'

[colors.cursor]
text     = '#030303'
cursor   = '#abb2bf'

[colors.selection]
text       = '#abb2bf'
background = '#1e242e'

[colors.normal]
black   = '#3f4451'   # terminal.ansi.black
red     = '#ef5f6b'   # terminal.ansi.red
green   = '#8cc265'   # terminal.ansi.green
yellow  = '#ebc275'   # terminal.ansi.yellow
blue    = '#5ab0f6'   # terminal.ansi.blue
magenta = '#c162de'   # terminal.ansi.magenta
cyan    = '#4dbdcb'   # terminal.ansi.cyan
white   = '#d7dae0'   # terminal.ansi.white

[colors.bright]
black   = '#4f5666'   # terminal.ansi.bright_black
red     = '#ef5f6b'   # terminal.ansi.bright_red
green   = '#a5e075'   # terminal.ansi.bright_green
yellow  = '#ebc275'   # terminal.ansi.bright_yellow
blue    = '#5ab0f6'   # terminal.ansi.bright_blue
magenta = '#de73ff'   # terminal.ansi.bright_magenta
cyan    = '#4dbdcb'   # terminal.ansi.bright_cyan
white   = '#e6e6e6'   # terminal.ansi.bright_white
