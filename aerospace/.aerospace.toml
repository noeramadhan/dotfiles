# after-startup-command = [
#     'exec-and-forget sketchybar',
# ]

# exec-on-workspace-change = ['/bin/bash', '-c',
#     'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
# ]

# after-startup-command = [
#   'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
# ]

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       5
outer.right =      5
outer.top =        5
outer.bottom =     5

[mode.main.binding]
cmd-h = []

cmd-shift-h = 'focus --boundaries-action wrap-around-the-workspace left'
cmd-shift-j = 'focus --boundaries-action wrap-around-the-workspace down'
cmd-shift-k = 'focus --boundaries-action wrap-around-the-workspace up'
cmd-shift-l = 'focus --boundaries-action wrap-around-the-workspace right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-cmd-shift-h = 'join-with left'
alt-cmd-shift-j = 'join-with down'
alt-cmd-shift-k = 'join-with up'
alt-cmd-shift-l = 'join-with right'

cmd-backtick = 'workspace-back-and-forth'
cmd-1 = ['workspace 1']
cmd-2 = ['workspace 2']
cmd-3 = ['workspace 3']
cmd-4 = ['workspace 4']
cmd-5 = ['workspace 5']
cmd-6 = ['workspace 6']
cmd-7 = ['workspace 7']
cmd-8 = ['workspace 8']
cmd-9 = ['workspace 9']
cmd-0 = ['workspace 0']

# cmd-1 = ['workspace 1', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=1']
# cmd-2 = ['workspace 2', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=2']
# cmd-3 = ['workspace 3', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=3']
# cmd-4 = ['workspace 4', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=4']
# cmd-5 = ['workspace 5', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=5']
# cmd-6 = ['workspace 6', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=6']
# cmd-7 = ['workspace 7', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=7']
# cmd-8 = ['workspace 8', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=8']

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'

cmd-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'

cmd-m = 'mode launcher'


[mode.launcher.binding]
a = ['exec-and-forget open -a Zen', 'mode main']
s = ['exec-and-forget open -a Zed', 'mode main']
d = ['exec-and-forget open -a Alacritty', 'mode main']
f = ['exec-and-forget open -a Yaak', 'mode main']
g = ['exec-and-forget open -a "GitHub Desktop"', 'mode main']
h = ['exec-and-forget open -a "Navicat Premium Lite"', 'mode main']
j = ['exec-and-forget open -a WhatsApp', 'mode main']

cmd-m = 'mode main'
esc = 'mode main'
enter = 'mode main'
backspace = 'mode main'


[[on-window-detected]]
if.app-name-regex-substring = 'Zen'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-name-regex-substring = 'Orion'
run = ['move-node-to-workspace 1']



[[on-window-detected]]
if.app-name-regex-substring = 'Zed'
run = ['move-node-to-workspace 2']



[[on-window-detected]]
if.app-name-regex-substring = 'Alacritty'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
run = ['move-node-to-workspace 3']



[[on-window-detected]]
if.app-name-regex-substring = 'Yaak'
run = ['move-node-to-workspace 4']



[[on-window-detected]]
if.app-name-regex-substring = 'Github Desktop'
run = ['move-node-to-workspace 5']



[[on-window-detected]]
if.app-name-regex-substring = 'Navicat'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-name-regex-substring = 'DBeaver'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-name-regex-substring = 'DataGrip'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-name-regex-substring = 'DB Pro'
run = ['move-node-to-workspace 6']



[[on-window-detected]]
if.app-name-regex-substring = 'WhatsApp'
run = ['move-node-to-workspace 0']



[[on-window-detected]]
if.app-name-regex-substring = 'mpv'
run = ['layout floating']



[[on-window-detected]]
check-further-callbacks = true
run = ['move-node-to-workspace 8']
