# SHELL & TERMINAL
set-option -g default-shell /opt/homebrew/bin/nu
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc,RGB"

# PERFORMANCE
set -g escape-time 0
set -g display-time 2000
set -g status-interval 30
set -g history-limit 50000
set -g aggressive-resize on

# CORE
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g clock-mode-style 24
set -g visual-bell on
set -g bell-action any
set -g visual-activity off
setw -g automatic-rename on
setw -g mode-keys vi

# KEYBINDINGS
# Copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Windows
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window
bind -n M-q       kill-window
bind c new-window -c "#{pane_current_path}"

# Panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-z resize-pane -Z
bind \; split-window -h -c "#{pane_current_path}"
bind \' split-window -v -c "#{pane_current_path}"
bind L  split-window -h -p 35 -c "#{pane_current_path}"

# Popups
bind -n M-t display-popup -E -w 50% -h 50% -d '#{pane_current_path}' 'nu'
bind -n M-g display-popup -E -w 70% -h 60% -d '#{pane_current_path}' 'gitui'
bind -n M-y display-popup -E -w 50% -h 50% -d '#{pane_current_path}' \
  '/bin/sh -c "tmux new-session -d -s bg 2>/dev/null; tmux set-option -t bg status off; tmux attach-session -t bg"'

# Session management
bind -n M-r command-prompt -p "Run:" \
  "run-shell '$HOME/.config/tmux/run-session.sh \"%%\" \"#{pane_current_path}\"'"
bind -n M-s run-shell "tmux ls | fzf-tmux -p 40%,20% --prompt='Switch Session > ' | cut -d: -f1 | xargs tmux switch-client -t"
bind -n M-x run-shell "tmux ls | fzf-tmux -p 40%,20% --prompt='Kill Session > '  | cut -d: -f1 | xargs tmux kill-session -t"
bind -n M-w run-shell "tmux list-windows | fzf-tmux -p 40%,20% --prompt='Switch Window > ' | cut -d: -f1 | xargs tmux select-window -t"

# Vault navigation
bind -n M-i run-shell "ls ~/Documents/VAULT | fzf-tmux -p 15%,15% --prompt='Notes > ' | xargs -I{} tmux new-window -c ~/Documents/VAULT/{}/NOTES 'hx .'"
bind -n M-p run-shell "ls ~/Documents/VAULT/PERSONAL/RESEARCH | fzf-tmux -p 15%,50% --prompt='Research > ' | xargs -I{} tmux new-window -c ~/Documents/VAULT/PERSONAL/RESEARCH/{} 'hx .'"
bind -n M-o run-shell "ls ~/Documents/VAULT | fzf-tmux -p 15%,15% --prompt='Repos > ' | xargs -I{} sh -c 'ls ~/Documents/VAULT/{}/REPO | fzf-tmux -p 30%,50% --prompt=\"{} > \" | xargs -I{{}} tmux new-window -c ~/Documents/VAULT/{}/REPO/{{}} \"hx .\"'"

# Reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# APPEARANCE
set -g status-position top
set -g status-style default
set -g status-left ""
set -g status-left-length 50
set -g status-right-length 150
set -g status-right "#(pmset -g batt | awk '/InternalBattery/ {gsub(/;$/,\"\",$3); gsub(/;$/,\"\",$4); if ($4 == \"charging\") {print \"#[fg=green]\"$3} else if ($4 == \"discharging\") {print \"#[fg=yellow]\"$3} else if ($4 == \"charged\") {print \"#[fg=cyan]\"$3} else {print $3}}') #[fg=white] %Y.%m.%d  %H.%M"
set -g window-status-bell-style "fg=red,bold"
set -g window-status-current-format "#[fg=green]#{?bell_flag,#[fg=red]!,}"
set -g window-status-format "#{?bell_flag,#[fg=red]!,}"

# Borders
set -g pane-border-lines single
set -g pane-border-style fg=brightblack,dim
set -g pane-active-border-style fg=green
