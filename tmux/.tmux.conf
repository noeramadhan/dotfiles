# ============================================================================
# SHELL & TERMINAL
# ============================================================================
set-option -g default-shell /usr/local/bin/nu
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set-environment -g PATH "/usr/local/bin:/bin:/usr/bin"

# Ghostty terminal settings (alternative)
# set -g default-terminal "xterm-ghostty"
# set -ga terminal-overrides ",xterm-ghostty:Tc"

# ============================================================================
# PERFORMANCE
# ============================================================================
set -g escape-time 0
set -g display-time 2000
set -g status-interval 60
set -g history-limit 5000
set -g aggressive-resize on

# ============================================================================
# CORE SETTINGS
# ============================================================================
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
set -g renumber-windows on
set -g clock-mode-style 24
setw -g pane-base-index 1
setw -g automatic-rename on
setw -g mode-keys vi

# ============================================================================
# KEYBINDINGS
# ============================================================================

# Copy mode (vi)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Window selection (Alt+number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Window management
bind -n C-S-Left previous-window
bind -n C-S-Right next-window
bind c new-window -c "#{pane_current_path}"
bind -n M-q kill-window

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-z resize-pane -Z

# Pane splitting
bind \; split-window -h -c "#{pane_current_path}"
bind \' split-window -v -c "#{pane_current_path}"
bind T split-window -v -p 16 -c "#{pane_current_path}"
bind L split-window -h -p 35 -c "#{pane_current_path}"
bind -n M-y split-window -h -p 35 -c "#{pane_current_path}" 'nu -l -c "wj ./njtest"'

# Special windows
bind J new-window \; send-keys "jt" C-m \; split-window -h \; send-keys "jn" C-m \; rename-window "Journal"
# bind M new-window \; send-keys "jolt" C-m \; split-window -v \; send-keys "btop" C-m \; rename-window "Monitor"

# Popups
bind -n M-t display-popup -E -w 70% -h 60% -d '#{pane_current_path}' 'tmux new-session -A -s popup'
bind -n M-o display-popup -E 'nu -l -c "work-popup"'
bind -n M-g display-popup -E -w 70% -h 60% -d '#{pane_current_path}' 'gitui'

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ============================================================================
# APPEARANCE
# ============================================================================

# Status bar
set -g status-position top
set -g status-style default
set -g status-left-length 50
set -g status-left ""
set -g status-right-length 150
set -g status-right "#(pmset -g batt | awk '/InternalBattery/ {gsub(/;$/,\"\",$3); print $3}')% | %Y.%m.%d %H.%M"

# Window status format
set -g window-status-current-format "#[fg=lime]#W"
set -g window-status-format "#W"

# Borders
set -g pane-border-style fg=brightblack,dim
set -g pane-active-border-style fg=lime

